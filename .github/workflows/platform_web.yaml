name: platform_web

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the develop branch
on:
  workflow_dispatch:

  push:
    tags:
      - "web-v[0-9]+.[0-9]+.[0-9]+*"
    branches: [develop, main]
    paths:
      - "cached_network_image_web/**"
      - ".github/workflows/platform_web.yaml"
  pull_request:
    branches: [develop, main]
    paths:
      - "cached_network_image_web/**"
      - ".github/workflows/platform_web.yaml"

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  format:
    name: Format

    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    env:
      source-directory: ./cached_network_image_web

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      # Make sure the stable version of Flutter is available
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          architecture: x64
          cache: true

      # Create dependency overrides for cross-package resolution
      - name: Create dependency overrides
        run: bash .github/scripts/setup_overrides.sh

      # Download all Flutter packages
      - name: Download dependencies
        run: flutter pub get
        working-directory: ${{env.source-directory}}

      # Run Flutter Format to ensure formatting is valid
      - name: Run Flutter Format
        run: dart format --set-exit-if-changed .
        working-directory: ${{env.source-directory}}

  analyze:
    name: Analyze

    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    env:
      source-directory: ./cached_network_image_web

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      # Make sure the stable version of Flutter is available
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          architecture: x64
          cache: true

      # Create dependency overrides for cross-package resolution
      - name: Create dependency overrides
        run: bash .github/scripts/setup_overrides.sh

      # Download all Flutter packages
      - name: Download dependencies
        run: flutter pub get
        working-directory: ${{env.source-directory}}

      # Run Flutter Analyzer
      - name: Run Flutter Analyzer
        run: flutter analyze
        working-directory: ${{env.source-directory}}

  tests:
    name: Unit-tests
    runs-on: ubuntu-latest

    env:
      source-directory: ./cached_network_image_web

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          architecture: x64
          cache: true

      - name: Create dependency overrides
        run: bash .github/scripts/setup_overrides.sh

      - name: Download dependencies
        run: flutter pub get
        working-directory: ${{env.source-directory}}

      - name: Run unit tests
        run: flutter test --platform chrome
        working-directory: ${{env.source-directory}}

  publish:
    if: ${{ github.ref_type == 'tag' }}
    name: Publish package
    permissions:
      id-token: write
    needs: [format, analyze, tests]
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    env:
      source-directory: ./cached_network_image_web

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      # Make sure the stable version of Flutter is available
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          architecture: x64
          cache: true

      # Create dependency overrides for cross-package resolution
      - name: Create dependency overrides
        run: bash .github/scripts/setup_overrides.sh

      # Download all Flutter packages
      - name: Download dependencies
        run: flutter pub get
        working-directory: ${{env.source-directory}}

      # Publish the package
      - name: Publish package
        run: dart pub publish -v -f
        working-directory: ${{env.source-directory}}
